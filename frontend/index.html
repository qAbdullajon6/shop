<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to report real
         values on notched iPhones and inside the Telegram Mini App shell.
         Without it the fixed bottom navigation sits under the home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141414" />

    <!-- Primary SEO -->
    <title>Zahabi Parfüm — Hashamatli Atirlar Onlayn Do'koni</title>
    <meta
      name="description"
      content="Zahabi Parfüm — O'zbekistondagi eng yaxshi parfyumeriya onlayn do'koni. Chanel, Dior, Gucci, YSL, Versace va boshqa premium brendlarning original atirlarini qulay narxlarda sotib oling."
    />
    <meta
      name="keywords"
      content="parfyum, atir, parfyumeriya, Chanel, Dior, Gucci, YSL, Versace, erkaklar atiri, ayollar atiri, unisex atir, Toshkent"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://zahabi.uz/" />

    <!-- Open Graph (Facebook, VK) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://zahabi.uz/" />
    <meta property="og:title" content="Zahabi Parfüm — Hashamatli Atirlar Onlayn Do'koni" />
    <meta
      property="og:description"
      content="O'zbekistondagi eng yaxshi parfyumeriya do'koni. Original brend atirlarini qulay narxlarda xarid qiling."
    />
    <meta property="og:image" content="https://zahabi.uz/og-image.jpg" />
    <meta property="og:locale" content="uz_UZ" />
    <meta property="og:site_name" content="Zahabi Parfüm" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zahabi Parfüm — Hashamatli Atirlar" />
    <meta
      name="twitter:description"
      content="Original brend atirlarini qulay narxlarda xarid qiling. Toshkent va O'zbekiston bo'ylab yetkazib berish."
    />
    <meta name="twitter:image" content="https://zahabi.uz/og-image.jpg" />

    <!-- Telegram Mini App SDK — Telegram ichida ochilganda window.Telegram.WebApp beradi.
         Oddiy brauzerda zararsiz (WebApp obyekti bo'lmaydi, ilova OTP oqimida ishlaydi). -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Zahabi Parfüm",
        "url": "https://zahabi.uz",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://zahabi.uz/products?search={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
